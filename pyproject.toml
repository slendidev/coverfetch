[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coverfetch"
version = "0.1.0"
description = "FastAPI service for finding Apple Music cover art"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "requests",
  "uvicorn",
]

[project.scripts]
coverfetch = "coverfetch.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
